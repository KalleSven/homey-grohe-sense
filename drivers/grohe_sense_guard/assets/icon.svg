<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>
  </defs>
  <!-- Sense Guard device shape -->
  <rect x="20" y="15" width="60" height="70" rx="14" fill="url(#guardGrad)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Pipe connections -->
  <rect x="8" y="44" width="12" height="12" rx="2" fill="#90CAF9" />
  <rect x="80" y="44" width="12" height="12" rx="2" fill="#90CAF9" />
  <!-- Center circle indicator / valve ring -->
  <circle cx="50" cy="46" r="18" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="50" cy="46" r="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="50" cy="46" r="7" fill="#00E5FF"/>
  <!-- Status light bar -->
  <rect x="36" y="70" width="28" height="4" rx="2" fill="#B2EBF2" />
</svg>
