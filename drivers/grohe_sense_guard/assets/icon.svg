<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="100%" height="100%">
  <!-- Outer LED Ring (Horizontal Rounded Stadium Housing) -->
  <rect x="100" y="280" width="760" height="400" rx="200" 
        fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Front Bezel Line -->
  <rect x="130" y="310" width="700" height="340" rx="170" 
        fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>

  <!-- Center-Top Grohe Brand Waveform -->
  <path d="M430,410 Q455,395 480,410 T530,410" 
        fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <path d="M440,425 Q460,413 480,425 T520,425" 
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Left Button: Connection / Wi-Fi -->
  <circle cx="390" cy="525" r="48" 
          fill="none" stroke="#000000" stroke-width="14"/>
  <!-- Wi-Fi Wave and Dot -->
  <path d="M372,514 Q390,500 408,514" 
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  <path d="M378,525 Q390,515 402,525" 
        fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  <circle cx="390" cy="538" r="4.5" fill="#000000"/>

  <!-- Right Button: Water ON/OFF (Valve) -->
  <circle cx="570" cy="525" r="48" 
          fill="none" stroke="#000000" stroke-width="14"/>
  <!-- Power / Valve Symbol -->
  <line x1="570" y1="504" x2="570" y2="524" 
        stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  <path d="M552,518 A20,20 0 1,0 588,518" 
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>

  <!-- Concentric Acoustic / Ripple Wave Lines around buttons -->
  <path d="M310,525 C310,470 345,435 390,435" 
        fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M280,525 C280,445 325,405 390,405" 
        fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-opacity="0.2"/>

  <path d="M650,525 C650,470 615,435 570,435" 
        fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M680,525 C680,445 635,405 570,405" 
        fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-opacity="0.2"/>
</svg>
