<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="100%" height="100%">
  <!-- Puck cylindrical body (sides and bottom) -->
  <path d="M120,340 L120,560 C120,730 840,730 840,560 L840,340" 
        fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Puck top perimeter -->
  <ellipse cx="480" cy="340" rx="360" ry="170" 
           fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Inner beveled edge -->
  <ellipse cx="480" cy="340" rx="285" ry="135" 
           fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-opacity="0.75"/>
  
  <!-- Grohe Sense droplet motif on top -->
  <path d="M480,245 C480,245 410,315 410,360 C410,395 440,420 480,420 C520,420 550,395 550,360 C550,315 480,245 480,245 Z" 
        fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central LED status dot -->
  <circle cx="480" cy="355" r="10" fill="#000000"/>
</svg>